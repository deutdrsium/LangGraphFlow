<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>物理评分 WebUI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0f1e;
      color: #e0e0e0;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      min-height: 100vh;
      padding: 16px;
    }
    h1 {
      color: #7df9ff;
      font-size: 18px;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .subtitle {
      color: #556;
      font-size: 11px;
      margin-bottom: 16px;
    }
    .sessions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 14px;
    }
    .session-card {
      background: #0d1a35;
      border: 1px solid #1a3a6a;
      border-radius: 8px;
      padding: 14px;
      position: relative;
      transition: border-color 0.2s;
    }
    .session-card.finished { border-color: #27ae60; }
    .session-card.running { border-color: #f39c12; }
    .session-card.error { border-color: #e74c3c; }
    .session-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .task-id {
      color: #7df9ff;
      font-size: 11px;
      opacity: 0.7;
    }
    .status-badge {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
    }
    .status-badge.finished { background: #1e5e35; color: #2ecc71; }
    .status-badge.running  { background: #5a3a00; color: #f39c12; }
    .status-badge.error    { background: #4a0f0f; color: #e74c3c; }
    .status-badge.not_found { background: #2a2a2a; color: #888; }

    /* 总分展示 */
    .score-total {
      background: #162040;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 10px;
      text-align: center;
    }
    .score-total-label {
      color: #8899aa;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }
    .score-total-value {
      color: #f9ca24;
      font-size: 22px;
      font-weight: bold;
    }

    /* 得分要点列表 */
    .criteria-list { margin-top: 8px; }
    .criterion-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 8px;
      margin-bottom: 6px;
      border-radius: 5px;
      border-left: 3px solid;
      background: #0a1428;
    }
    .criterion-item.pass { border-color: #2ecc71; }
    .criterion-item.fail { border-color: #e74c3c; }
    .criterion-icon {
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .criterion-body { flex: 1; min-width: 0; }
    .criterion-text {
      color: #ccc;
      font-size: 11px;
      line-height: 1.5;
      word-break: break-word;
    }
    .criterion-reason {
      color: #778;
      font-size: 10px;
      margin-top: 3px;
      line-height: 1.4;
    }
    .criterion-pts {
      font-weight: bold;
      font-size: 13px;
      flex-shrink: 0;
      min-width: 40px;
      text-align: right;
    }
    .criterion-pts.pass { color: #2ecc71; }
    .criterion-pts.fail { color: #e74c3c; }

    /* 加载状态 */
    .loading-pulse {
      display: inline-block;
      animation: pulse 1.2s infinite;
      color: #f39c12;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .empty-state {
      text-align: center;
      color: #556;
      padding: 60px 20px;
      font-size: 14px;
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 10px; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .refresh-info {
      color: #556;
      font-size: 10px;
      text-align: right;
    }
    .btn-clear-all {
      background: #2a1a1a;
      color: #e74c3c;
      border: 1px solid #5a2a2a;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-family: monospace;
    }
    .btn-clear-all:hover { background: #3a2020; }

    .error-msg { color: #e74c3c; font-size: 11px; padding: 8px; }
  </style>
</head>
<body>
  <div class="header-bar">
    <div>
      <h1>🔬 物理评分 WebUI</h1>
      <div class="subtitle">Flash 模型快速评分 · 自动刷新</div>
    </div>
    <div style="text-align:right;">
      <button class="btn-clear-all" onclick="clearAllSessions()">清空记录</button>
      <div class="refresh-info" id="refresh-info">--</div>
    </div>
  </div>

  <div id="sessions-container">
    <div class="empty-state">
      <div class="icon">⏳</div>
      正在加载评分任务...
    </div>
  </div>

  <script>
    let physicsSessionsCache = {};

    function statusBadge(status) {
      const labels = { finished: '已完成', running: '评分中', error: '出错', not_found: '未找到' };
      const cls = status || 'not_found';
      return `<span class="status-badge ${cls}">${labels[cls] || cls}</span>`;
    }

    function renderSession(session) {
      let card = `<div class="session-card ${session.status || ''}">`;
      card += `<div class="session-card-header">
        <span class="task-id">ID: ${(session.task_id || '').substring(0, 16)}...</span>
        ${statusBadge(session.status)}
      </div>`;

      if (session.status === 'running') {
        card += `<div style="text-align:center; padding:20px 0;">
          <span class="loading-pulse">⏳ Flash 模型评分中，请稍候...</span>
        </div>`;
      } else if (session.status === 'error') {
        card += `<div class="error-msg">❌ 错误: ${session.error || '未知错误'}</div>`;
      } else if (session.status === 'finished' && session.result) {
        let r = session.result;
        let results = r.results || [];
        let scoreString = r.score_string || '0';

        // 总分
        card += `<div class="score-total">
          <div class="score-total-label">总分</div>
          <div class="score-total-value">${scoreString}</div>
        </div>`;

        // 逐条得分要点
        card += `<div style="color:#7df9ff; font-size:10px; margin-bottom:6px; font-weight:bold; letter-spacing:0.5px;">得分要点</div>`;
        card += `<div class="criteria-list">`;
        for (let item of results) {
          let awarded = item.points_awarded !== undefined ? item.points_awarded : 0;
          let satisfied = item.satisfied === true || awarded > 0;
          let cls = satisfied ? 'pass' : 'fail';
          let icon = satisfied ? '✓' : '✗';
          let criterionText = (item.criterion || '').length > 120
            ? (item.criterion || '').substring(0, 120) + '...'
            : (item.criterion || '');
          let reasonText = (item.reason || '').length > 120
            ? (item.reason || '').substring(0, 120) + '...'
            : (item.reason || '');

          card += `<div class="criterion-item ${cls}">
            <span class="criterion-icon">${icon}</span>
            <div class="criterion-body">
              <div class="criterion-text">${escHtml(criterionText)}</div>
              ${reasonText ? `<div class="criterion-reason">${escHtml(reasonText)}</div>` : ''}
            </div>
            <span class="criterion-pts ${cls}">${awarded}</span>
          </div>`;
        }
        card += `</div>`;
      }

      card += `</div>`;
      return card;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function fetchAndRender() {
      try {
        let res = await fetch(`/api/physics_sessions?_t=${Date.now()}`);
        if (!res.ok) throw new Error('API error');
        let data = await res.json();
        let sessions = (data.sessions || []).slice().reverse(); // 最新的先显示

        let container = document.getElementById('sessions-container');
        let refreshInfo = document.getElementById('refresh-info');
        refreshInfo.textContent = `上次刷新: ${new Date().toLocaleTimeString('zh-CN')}`;

        if (sessions.length === 0) {
          container.innerHTML = `<div class="empty-state">
            <div class="icon">🔬</div>
            暂无评分任务<br><span style="font-size:11px;">等待油猴脚本推送物理题...</span>
          </div>`;
          return;
        }

        let html = `<div class="sessions-grid">`;
        for (let s of sessions) {
          html += renderSession(s);
        }
        html += `</div>`;
        container.innerHTML = html;
      } catch(e) {
        console.error('Fetch error:', e);
        document.getElementById('refresh-info').textContent = '⚠️ 刷新失败';
      }
    }

    async function clearAllSessions() {
      if (!confirm('确定要清空所有评分记录吗？')) return;
      try {
        await fetch('/api/physics_clear', { method: 'POST' });
        fetchAndRender();
      } catch(e) {
        alert('清空失败: ' + e.message);
      }
    }

    // 初始加载 + 定时刷新
    fetchAndRender();
    setInterval(fetchAndRender, 2500);
  </script>
</body>
</html>
